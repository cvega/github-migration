[test]
preload = ["./src/test-setup.ts"]

# Collect coverage on every `bun test` for visibility. The repository's fail-closed
# gate is `scripts/checks/coverage-check.ts` (run via the `coverage` gate in
# `bun run verify`). The values below are kept in sync with that script as documentation.
# Octokit/network I/O wrappers (github.ts) and deep pipeline orchestration
# (migration.ts) are intentionally excluded as integration-tested concerns.
coverage = true
coverageThreshold = { line = 0.90, function = 0.90 }
