services:
  gitlab:
    image: gitlab/gitlab-ce:19.2.11-ce.0@sha256:ea8dabbb94bba5e845bf156e1c08ea8cf82eeb29f641ab1fc30628480674335f
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_PROVIDER_ROOT_PASSWORD:?}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:8929'
    ports:
      - "127.0.0.1:8929:8929"
    volumes:
      - config:/etc/gitlab
      - logs:/var/log/gitlab
      - data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8929/-/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 12

volumes:
  config:
  logs:
  data:
