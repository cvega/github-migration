services:
  gh-migrate:
    image: ${GH_MIGRATE_IMAGE:-gh-migrate:local}
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - "${GH_MIGRATE_PUBLISH_HOST:-127.0.0.1}:3000:3000"
    volumes:
      - gh-migrate-data:/data
      - gh-migrate-archives:/archives
    environment:
      - DATA_DIR=/data
      - ARCHIVE_DIR=/archives
      - EXPORTER_ARCHIVE_VOLUME=${EXPORTER_ARCHIVE_VOLUME:-gh-migrate-archives}
      - BBS_EXPORTER_IMAGE=${BBS_EXPORTER_IMAGE:-gh-migrate/bbs-exporter:1.13.0-validation}
      - PORT=3000
      - ORIGIN=${ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  profile-analyzer:
    image: ${GH_MIGRATE_ANALYZER_IMAGE:-gh-migrate-profile-analyzer:local}
    build:
      context: .
      target: profile-analyzer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - gh-migrate-data:/data
      - gh-migrate-analysis-workspaces:/analysis
    environment:
      - DATA_DIR=/data
      - ANALYSIS_DIR=/analysis
      - ANALYSIS_WORKSPACE_LIMIT_BYTES=${ANALYSIS_WORKSPACE_LIMIT_BYTES:-}
      - ANALYSIS_RUN_ONCE=${ANALYSIS_RUN_ONCE:-false}
    # Inherits the image's loopback progress health check. No published port.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gh-migrate-data:
    name: ${GH_MIGRATE_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_gh-migrate-data}
  gh-migrate-analysis-workspaces:
    name: ${GH_MIGRATE_ANALYSIS_VOLUME:-${COMPOSE_PROJECT_NAME}_gh-migrate-analysis-workspaces}
  gh-migrate-archives:
    name: ${EXPORTER_ARCHIVE_VOLUME:-gh-migrate-archives}
