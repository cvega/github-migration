<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mappings · Design preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:15px/1.5 system-ui,sans-serif;color-scheme:dark}header{padding:14px 5%;background:#010409;border-bottom:1px solid #30363d;font-weight:600;display:flex;align-items:center;gap:12px}header svg{color:#8b949e}header small{margin-left:auto;color:#9198a1;font-weight:400}main{max-width:1050px;padding:42px 30px;margin:auto}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid #3d444d;border-radius:6px;background:#212830;padding:5px 12px}button{cursor:pointer;font-size:14px;font-weight:550}button:hover{border-color:#8b949e}.primary{background:#238636;border-color:#399348;color:white}.context{display:flex;align-items:center;gap:9px;color:#9198a1;font-size:14px}.context strong{color:#c9d1d9}.context select{max-width:100%;font-size:14px}h1{font-size:32px;letter-spacing:-.03em;margin:20px 0 0}p{color:#a0a9b4;margin:3px 0 20px}nav{display:flex;gap:8px;border-bottom:1px solid #30363d}nav button{background:none;border:0;border-radius:0;padding:10px 13px;color:#a0a9b4}nav button[aria-pressed=true]{color:#f0f6fc;border-bottom:2px solid #f78166}.count{font-size:12px;background:#262d35;color:#c9d1d9;border-radius:10px;padding:1px 7px;margin-left:4px}.tools,footer{display:flex;align-items:center;gap:8px}.tools{margin:22px 0 12px}.tools strong{margin-right:auto}.list{border:1px solid #30363d;border-radius:7px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr);align-items:center;gap:8px;padding:15px 18px}.labels{background:#151b23;padding-block:8px;color:#9da7b2;font-size:13px;font-weight:550}.row+.row{border-top:1px solid #30363d}.row b,.row small{display:block;overflow-wrap:anywhere}.row b{font:500 15px/1.5 ui-monospace,monospace}.row small,.arrow,.quiet{color:#9198a1;font-size:13px}.arrow{font-size:18px}.panel{border:1px solid #484f58;border-radius:7px;margin-bottom:16px;padding:16px 18px;background:#151b23}.panel h2{font-size:17px;margin:0 0 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px;font-weight:550}input{display:block;width:100%;margin:5px 0 12px;background:#0d1117;font-weight:400}footer{justify-content:flex-end;margin-top:10px}.preview{padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:4px;font:13px/1.7 ui-monospace,monospace;overflow:auto}.quiet{margin-top:10px}code{color:#c9d1d9}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #58a6ff;outline-offset:2px}@media(max-width:640px){main{padding:22px 14px}.context{flex-wrap:wrap}.tools{flex-wrap:wrap}.tools strong{width:100%}.fields{grid-template-columns:1fr}.row{grid-template-columns:1fr;padding:12px 14px;gap:2px}.labels{display:none}.arrow{display:none}.row div:last-child:before{content:"To ";color:#9198a1;font-size:13px}.row div:last-child b{display:inline}.row div:last-child{margin-top:6px}header small{font-size:12px}}
</style>
<header><svg aria-hidden="true" width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h8l4 5-4 5H3zM7 10h10m-3-3 3 3-3 3"/></svg>Migration Toolkit <small>Design preview</small></header>
<main><div class="context"><span>Destination</span><select id="target" aria-label="Destination"><option>GHES · bitbucket-migration-test</option><option>GHEC · example-org</option></select></div>
<h1>Mappings</h1><p>Match source users and teams to their GitHub destination.</p>
<nav aria-label="Mapping type"><button id="users">Users <span class="count"></span></button><button id="teams">Teams <span class="count"></span></button></nav>
<div class="tools"><strong id="heading"></strong><button id="csv">Import CSV</button><button class="primary" id="add"></button></div>
<section id="panel" class="panel" hidden></section><div id="list" class="list"></div></main>
<script>
const $=s=>document.querySelector(s),rows={ghes:{Users:[['admin','Bitbucket · /users/admin','@ghe-admin']],Teams:[['project_admin_access','Bitbucket · TEST','project_admin_access']]},ghec:{Users:[],Teams:[]}};
let tab='Users',mode='',scope='ghes';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const user=tab==='Users',kind=user?'user':'team',org=scope==='ghes'?'bitbucket-migration-test':'example-org',data=rows[scope][tab];for(const name of ['Users','Teams']){let b=$('#'+name.toLowerCase());b.setAttribute('aria-pressed',String(tab===name));b.querySelector('span').textContent=rows[scope][name].length}$('#heading').textContent='Saved '+kind+' mappings';$('#add').textContent='Add '+kind+' mapping';$('#list').innerHTML=data.length?'<div class="row labels"><span>Source '+(user?'user':'group or team')+'</span><span></span><span>GitHub '+kind+'</span></div>'+data.map(([src,desc,dst])=>`<div class="row"><div><b>${escape(src)}</b><small>${escape(desc)}</small></div><span class="arrow">→</span><div><b>${escape(dst)}</b><small>${escape(org)}</small></div></div>`).join(''):'<div class="row">No saved '+kind+' mappings.</div>';const p=$('#panel');p.hidden=!mode;if(!mode)return;const example=user?'http://bitbucket:7990/users/admin':'http://bitbucket:7990/admin/groups/view?name=project_admin_access#TEST',dest=user?'ghe-admin':'project_admin_access';p.innerHTML=mode==='manual'?`<h2>Add ${kind} mapping</h2><form><div class="fields"><label>Source ${user?'user':'group or team'} URL<input required type="url" id="source" placeholder="${example}"></label><label>GitHub ${user?'username':'team slug'}<input required id="dest" placeholder="${dest}"></label></div><footer><button type="button" class="cancel">Cancel</button><button class="primary">Save mapping</button></footer></form>`:`<h2>Import ${kind} mappings from CSV</h2><label>CSV file<input type="file" accept=".csv,text/csv"></label><div class="quiet">Expected columns · example row</div><div class="preview">source_url,${user?'target_login':'target_team_slug'}<br>${escape(example)},${dest}</div><footer><button class="cancel">Close preview</button></footer>`;p.querySelector('.cancel').onclick=()=>{mode='';render()};if(mode==='manual')p.querySelector('form').onsubmit=e=>{e.preventDefault();data.push([$('#source').value,'Manual mapping',$('#dest').value]);mode='';render()}}
for(const t of ['Users','Teams'])$('#'+t.toLowerCase()).onclick=()=>{tab=t;mode='';render()};$('#target').onchange=e=>{scope=e.target.selectedIndex?'ghec':'ghes';mode='';render()};$('#add').onclick=()=>{mode='manual';render()};$('#csv').onclick=()=>{mode='csv';render()};render();
</script></html>
