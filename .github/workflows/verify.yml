# Reusable quality-gate workflow. Called by pr.yml, main.yml, and release.yml so
# the gate definition lives in exactly one place and can never drift between
# them — the CI counterpart to the local `bun run verify`.
name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          docker.io/rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d
          -color

      # `bun run gates` runs the exact 14-gate suite developers run locally
      # (typecheck · check · lint · format · coverage · dup · deadcode · cycles
      # · boundaries · build · audit), collects every failure (not fail-fast),
      # and exits non-zero if any gate is red.
      - name: Run gate suite
        run: bun run gates

  e2e:
    name: Browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium

      - name: Run browser regression suite
        run: bun run test:e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
