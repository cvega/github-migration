# Reusable quality-gate workflow. Called by pr.yml, main.yml, and release.yml so
# the gate definition lives in exactly one place and can never drift between
# them — the CI counterpart to the local `bun run verify`.
name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: Static checks, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          docker.io/rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d
          -color

      - name: Run repository gates
        run: bun scripts/gates.ts --except e2e

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium

      - name: Run browser gate
        run: bun scripts/gates.ts e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: Required checks
    needs: [gates, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both gate suites to pass
        env:
          GATES: ${{ needs.gates.result }}
          E2E: ${{ needs.e2e.result }}
        run: '[[ "$GATES" == success && "$E2E" == success ]]'

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Check container inputs
        id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE...$HEAD_SHA" -- Dockerfile .dockerignore docker-compose.yml deploy/ scripts/packaging/ entrypoint.sh package.json bun.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ $status == 1 ]] || exit "$status"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: github.event_name != 'pull_request' || steps.paths.outputs.changed == 'true'

      - name: Build dashboard image
        if: github.event_name != 'pull_request' || steps.paths.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: dashboard
          no-cache-filters: dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: gh-migrate:smoke-dashboard

      - name: Build analyzer image
        if: github.event_name != 'pull_request' || steps.paths.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: profile-analyzer
          no-cache-filters: profile-analyzer
          cache-from: type=gha,scope=profile-analyzer
          cache-to: type=gha,mode=max,scope=profile-analyzer
          load: true
          tags: gh-migrate:smoke-analyzer

      - name: Exercise production images
        if: github.event_name != 'pull_request' || steps.paths.outputs.changed == 'true'
        run: sh scripts/packaging/container-smoke.sh gh-migrate:smoke-dashboard gh-migrate:smoke-analyzer

      - name: Start base Compose without a local Bitbucket or runtime socket
        if: github.event_name != 'pull_request' || steps.paths.outputs.changed == 'true'
        env:
          COMPOSE_PROJECT_NAME: clean-host-smoke
          GH_MIGRATE_IMAGE: gh-migrate:smoke-dashboard
          GH_MIGRATE_ANALYZER_IMAGE: gh-migrate:smoke-analyzer
          EXPORTER_ARCHIVE_VOLUME: clean-host-smoke-archives
        run: |
          work=$(mktemp -d)
          cp docker-compose.yml "$work/"
          cp -R deploy "$work/"
          cd "$work"
          echo 'GH_MIGRATE_ALLOW_UNAUTHENTICATED=true' > .env
          trap 'docker compose down --volumes' EXIT
          docker compose up --no-build -d --wait --wait-timeout 90
          docker compose exec -T gh-migrate sh -ec 'test ! -e /var/run/docker.sock'
          docker compose -f docker-compose.yml -f deploy/compose.exporter.yml run --rm --no-deps \
            --entrypoint sh gh-migrate -ec 'test -S /var/run/docker.sock && test -d /archives'

      - name: Scan dashboard image
        if: github.event_name != 'pull_request' || steps.paths.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gh-migrate:smoke-dashboard
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan analyzer image
        if: github.event_name != 'pull_request' || steps.paths.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gh-migrate:smoke-analyzer
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
