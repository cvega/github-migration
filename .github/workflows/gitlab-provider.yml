# Slow, destructive provider contract. This runs only on a dedicated runner
# because GitLab requires substantially more CPU and memory than normal CI jobs.
name: "Self-hosted: GitLab provider contract"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: gitlab-provider-contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: GitLab 19.2 contract
    runs-on: [self-hosted, linux, x64, gitlab-provider]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Prepare provider harness
        run: |
          bun install --frozen-lockfile
          bun run verify provider-fixtures
          bun scripts/providers/gitlab.ts config

      - name: Validate runner capacity
        run: |
          test "$(nproc)" -ge 8
          test "$(awk '/MemTotal/ { print int($2 / 1024 / 1024) }' /proc/meminfo)" -ge 15
          docker compose version

      - name: Run GitLab provider contract
        id: contract
        run: |
          set -o pipefail
          bun scripts/providers/gitlab.ts run 2>&1 | tee gitlab-provider.log

      - name: Retry cleanup after an unsuccessful provider run
        if: always() && (steps.contract.outcome == 'failure' || steps.contract.outcome == 'cancelled')
        run: bun scripts/providers/gitlab.ts down

      - name: Upload failure diagnostics
        if: failure() && steps.contract.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitlab-provider-diagnostics
          path: gitlab-provider.log
          if-no-files-found: error
          retention-days: 7