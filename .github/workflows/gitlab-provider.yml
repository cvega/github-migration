# Slow, destructive provider contract. This runs only on a dedicated runner
# because GitLab requires substantially more CPU and memory than normal CI jobs.
name: GitLab provider contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: gitlab-provider-contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: GitLab 19.2 contract
    runs-on: [self-hosted, linux, x64, gitlab-provider]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate runner capacity
        run: |
          test "$(nproc)" -ge 8
          test "$(awk '/MemTotal/ { print int($2 / 1024 / 1024) }' /proc/meminfo)" -ge 15
          docker compose version

      - name: Run GitLab provider contract
        run: |
          set -o pipefail
          bun run provider:gitlab run 2>&1 | tee gitlab-provider.log

      - name: Ensure provider cleanup
        if: always()
        run: bun run provider:gitlab down

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitlab-provider-diagnostics
          path: gitlab-provider.log
          if-no-files-found: error
          retention-days: 7